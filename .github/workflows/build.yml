name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: UI tests
        shell: powershell
        run: .\test.ps1

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item bin\lg-input-switcher.exe, bin\lg-input-switcher-cli.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md dist\
          Compress-Archive -Path dist\* -DestinationPath lg-input-switcher.zip

      - uses: actions/upload-artifact@v4
        with:
          name: lg-input-switcher
          path: dist/

      # Every push to main publishes a release with the exe.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.${{ github.run_number }}"
          gh release create $tag lg-input-switcher.zip bin\lg-input-switcher.exe bin\lg-input-switcher-cli.exe `
            --title $tag `
            --notes "Unofficial, AI-assisted build. Download lg-input-switcher.exe and run it. See the README for supported hardware."
